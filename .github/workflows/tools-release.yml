# Релиз инструментов разработчика по метке tools-<версия>: coop_debug, coop_cheat и coop_lab одним релизом, с одной
# версией из метки.
# Релиз не становится «последним»: ссылка releases/latest в README ведёт на «Кооператив».
name: tools-release

on:
  push:
    tags: ["tools-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Версия
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#tools-}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::метка $GITHUB_REF_NAME, нужна tools-<X.Y.Z>"; exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Сборка и тесты
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.ver }}" bash build.sh | tee build.log

      - name: Описание релиза
        run: |
          {
            echo "\`coop_debug\`, \`coop_cheat\`, \`coop_lab\`: ${{ steps.ver.outputs.ver }}"
            echo
            cat docs/TOOLS.md
            echo; echo "---"; echo
            cat docs/TOOLS.ru.md
          } > notes.md

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/coop_debug.zip dist/coop_cheat.zip dist/coop_lab.zip \
            --target "$GITHUB_SHA" \
            --title "Инструменты разработчика / Developer tools ($GITHUB_REF_NAME)" \
            --notes-file notes.md \
            --latest=false
