# Проверка на каждый push и pull request: статический анализ, сборка, совпадение версий, все тесты (build.sh).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Статический анализ
        run: |
          pipx run ruff==0.17.3 check --output-format github .
          shellcheck build.sh
      - name: Сборка и тесты
        run: |
          set -o pipefail
          bash build.sh
      - name: Хэши библиотек ModKit
        run: cd libs && sha256sum -c SHA256SUMS
