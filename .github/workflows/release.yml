# Публикация релиза: GitHub → Actions → release → Run workflow.
# Версия берётся из mod/coop/mod.json; GitHub собирает мод, прогоняет тесты,
# создаёт метку v<версия> и релиз с coop.zip. Нужны результаты проверки на телефонах:
# docs/device-tests/<версия>.md (docs/RELEASE_CHECKLIST.md).
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Версия
        id: ver
        run: |
          VER=$(python3 -c "import json;print(json.load(open('mod/coop/mod.json',encoding='utf-8'))['version'])")
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::метка $GITHUB_REF_NAME, а в mod.json версия $VER"; exit 1
          fi

      - name: Проверка на телефонах и описание релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="docs/device-tests/${{ steps.ver.outputs.ver }}.md"
          if [ ! -f "$F" ]; then
            echo "::error::нет $F — сначала проверьте релиз на двух или более телефонах по docs/RELEASE_CHECKLIST.md"; exit 1
          fi
          # в описании — только изменения с прошлого опубликованного релиза, а не вся история release_notes.md
          PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          echo "прошлый релиз: ${PREV:-нет}"
          python3 tools/release_notes.py .github/release_notes.md "${{ steps.ver.outputs.ver }}" "$PREV" > changes.md
          { cat changes.md; echo; echo "---"; echo; cat "$F"; } > release_notes_full.md

      - name: Сборка и тесты
        run: |
          set -o pipefail
          bash build.sh | tee build.log      # build.sh сам завершается с ошибкой, если тесты не прошли или версии не совпадают

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::релиз ${{ steps.ver.outputs.tag }} уже есть — поднимите версию в mod/coop/mod.json"; exit 1
          fi
          gh release create "${{ steps.ver.outputs.tag }}" dist/coop.zip \
            --target "$GITHUB_SHA" \
            --title "Кооператив ${{ steps.ver.outputs.ver }}" \
            --notes-file release_notes_full.md
