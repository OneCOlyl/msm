# Релиз по метке версии: git tag v1.0.1 && git push origin v1.0.1
# GitHub собирает мод, прогоняет тесты и публикует релиз с coop.zip.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Проверка версии
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('mod/coop/mod.json',encoding='utf-8'))['version'])")
          if [ "$TAG" != "$VER" ]; then echo "::error::метка $GITHUB_REF_NAME, а в mod.json версия $VER"; exit 1; fi

      - name: Сборка и тесты
        run: |
          set -o pipefail
          bash build.sh | tee build.log
          if grep -q "FAIL" build.log; then echo "::error::тесты не прошли"; exit 1; fi

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/coop.zip \
            --title "Кооператив ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release_notes.md
