# Публикация релиза по метке v<версия>: GitHub собирает мод с версией из метки, прогоняет тесты и выпускает релиз
# с coop.zip. Нужны результаты проверки на телефонах: docs/device-tests/<версия>.md (docs/RELEASE_CHECKLIST.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Версия
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::метка $GITHUB_REF_NAME, нужна v<X.Y.Z>"; exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Проверка на телефонах и описание релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="docs/device-tests/${{ steps.ver.outputs.ver }}.md"
          if [ ! -f "$F" ]; then
            echo "::error::нет $F — сначала проверьте релиз на двух или более телефонах по docs/RELEASE_CHECKLIST.md"; exit 1
          fi
          # в описании — только изменения с прошлого опубликованного релиза, а не вся история release_notes.md
          PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          echo "прошлый релиз: ${PREV:-нет}"
          python3 tools/release_notes.py .github/release_notes.md "${{ steps.ver.outputs.ver }}" "$PREV" > changes.md
          { cat changes.md; echo; echo "---"; echo; cat "$F"; } > release_notes_full.md
          RU="${F%.md}.ru.md"
          if [ -f "$RU" ]; then { echo; echo "---"; echo; cat "$RU"; } >> release_notes_full.md; fi

      - name: Сборка и тесты
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.ver }}" bash build.sh | tee build.log

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::релиз ${{ steps.ver.outputs.tag }} уже есть — нужна новая метка"; exit 1
          fi
          gh release create "${{ steps.ver.outputs.tag }}" dist/coop.zip \
            --target "$GITHUB_SHA" \
            --title "Кооператив ${{ steps.ver.outputs.ver }}" \
            --notes-file release_notes_full.md
